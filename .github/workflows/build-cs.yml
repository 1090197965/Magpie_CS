name: build-cs

on:
  workflow_dispatch:
  push:
    branches: [experimental]

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Setup Conan
      run: pip install conan

    - name: Download DLSS SDK, NVAPI and DLSSNR runtime
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"
        New-Item -ItemType Directory -Force -Path dependencies | Out-Null

        function Get-RepoZip([string]$repo, [string]$outZip) {
          $meta = Invoke-RestMethod "https://api.github.com/repos/$repo"
          $branch = $meta.default_branch
          Write-Host "Downloading $repo@$branch source archive"
          Invoke-WebRequest -Uri "https://github.com/$repo/archive/refs/heads/$branch.zip" -OutFile $outZip
          $dir = "$outZip.extracted"
          Expand-Archive $outZip -DestinationPath $dir -Force
          return (Get-ChildItem $dir -Directory | Select-Object -First 1).FullName
        }

        $dlssRoot = Get-RepoZip "NVIDIA/DLSS" "dependencies\dlss-sdk.zip"
        $nvapiRoot = Get-RepoZip "NVIDIA/nvapi" "dependencies\nvapi.zip"

        if (-not (Test-Path "$dlssRoot\include\nvsdk_ngx.h")) { throw "nvsdk_ngx.h not found under $dlssRoot" }
        if (-not (Test-Path "$nvapiRoot\nvapi.h")) { throw "nvapi.h not found under $nvapiRoot" }
        Write-Host "DLSSSdkDir=$dlssRoot"
        Write-Host "NvapiSdkDir=$nvapiRoot"

        # DLSSNR runtime DLL from the upstream official release package
        $rel = Invoke-RestMethod "https://api.github.com/repos/SAOG0721/Magpie/releases?per_page=5"
        $rel = $rel | Where-Object { @($_.assets.name) -contains "Magpie-Experimental-x64.zip" } | Select-Object -First 1
        $asset = $rel.assets | Where-Object { $_.name -eq "Magpie-Experimental-x64.zip" }
        if (-not $asset) { throw "official package not found in upstream releases" }
        Write-Host "Downloading $($asset.name) ($([math]::Round($asset.size/1MB,1)) MB) from SAOG0721/Magpie@$($rel.tag_name)"
        Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "dependencies\official.zip"
        Expand-Archive "dependencies\official.zip" -DestinationPath "dependencies\official" -Force
        $dll = Get-ChildItem "dependencies\official" -Recurse -Filter "nvngx_dlssnr.dll" | Select-Object -First 1
        if (-not $dll) { throw "nvngx_dlssnr.dll not found in official package" }
        $dlssnrRoot = $dll.DirectoryName
        Write-Host "DLSSNRRuntimeDir=$dlssnrRoot"

        "DLSS_SDK_ROOT=$dlssRoot"    | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "NVAPI_SDK_ROOT=$nvapiRoot"  | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "DLSSNR_RT_ROOT=$dlssnrRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Enable native AI effects (DLSS SR / NR / Frame Generation)
      shell: pwsh
      run: |
        $lines = @(
          '<?xml version="1.0" encoding="utf-8"?>'
          '<Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">'
          '  <PropertyGroup>'
          '    <EnableDLSSSR>true</EnableDLSSSR>'
          '    <EnableDLSSNR>true</EnableDLSSNR>'
          '    <EnableDLSSFrameGeneration>true</EnableDLSSFrameGeneration>'
          '    <DLSSSdkDir>@DLSSROOT@</DLSSSdkDir>'
          '    <NvapiSdkDir>@NVAPIROOT@</NvapiSdkDir>'
          '    <DLSSNRRuntimeDir>@DLSSNRRT@</DLSSNRRuntimeDir>'
          '  </PropertyGroup>'
          '</Project>'
        )
        $content = ($lines -join [char]10).Replace('@DLSSROOT@', $env:DLSS_SDK_ROOT).Replace('@NVAPIROOT@', $env:NVAPI_SDK_ROOT).Replace('@DLSSNRRT@', $env:DLSSNR_RT_ROOT)
        # Generate the gitignored local override file that turns on DLSS build switches
        Out-File -InputObject $content -Encoding utf8 "$env:GITHUB_WORKSPACE\src\BuildOptions.props.user"
        Get-Content "$env:GITHUB_WORKSPACE\src\BuildOptions.props.user"

    - name: Build
      run: python scripts/publish.py --compiler=MSVC --platform=x64

    - name: Store build
      uses: actions/upload-artifact@v7
      with:
        name: Magpie_CS-x64
        path: ./publish/x64
