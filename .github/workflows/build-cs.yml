name: build-cs

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v6
      with:
        python-version: '3.13'

    - name: Setup Conan
      run: pip install conan

    - name: Download DLSS SDK and NVAPI (auto from NVIDIA official GitHub releases)
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        $ProgressPreference = "SilentlyContinue"
        New-Item -ItemType Directory -Force -Path dependencies | Out-Null

        function Get-LatestReleaseZip([string]$repo, [string]$outZip) {
          $rel = Invoke-RestMethod "https://api.github.com/repos/$repo/releases?per_page=1"
          $rel = $rel | Select-Object -First 1
          $asset = $rel.assets | Where-Object { $_.name -match '\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "no zip asset found in $repo latest release ($($rel.tag_name))" }
          Write-Host "Downloading $($asset.name) ($([math]::Round($asset.size/1MB,1)) MB) from $repo@$($rel.tag_name)"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $outZip
          $dir = "$outZip.extracted"
          Expand-Archive $outZip -DestinationPath $dir -Force
          return $dir
        }

        $dlssDir = Get-LatestReleaseZip "NVIDIA/DLSS" "dependencies\dlss-sdk.zip"
        $nvapiDir = Get-LatestReleaseZip "NVIDIA/nvapi" "dependencies\nvapi.zip"

        # Locate key headers as SDK root (tolerates different archive layouts)
        $dlssRoot = (Get-ChildItem $dlssDir -Recurse -Filter "nvsdk_ngx.h" | Select-Object -First 1).DirectoryName
        if (-not $dlssRoot) { throw "nvsdk_ngx.h not found in DLSS SDK package" }
        $nvapiRoot = (Get-ChildItem $nvapiDir -Recurse -Filter "nvapi.h" | Select-Object -First 1).DirectoryName
        if (-not $nvapiRoot) { throw "nvapi.h not found in NVAPI package" }
        Write-Host "DLSSSdkDir=$dlssRoot"
        Write-Host "NvapiSdkDir=$nvapiRoot"

        "DLSS_SDK_ROOT=$dlssRoot"   | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        "NVAPI_SDK_ROOT=$nvapiRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

    - name: Enable native AI effects (DLSS SR / NR / Frame Generation)
      shell: pwsh
      run: |
        $lines = @(
          '<?xml version="1.0" encoding="utf-8"?>'
          '<Project xmlns="http://schemas.microsoft.com/developer/msbuild/2003">'
          '  <PropertyGroup>'
          '    <EnableDLSSSR>true</EnableDLSSSR>'
          '    <EnableDLSSNR>true</EnableDLSSNR>'
          '    <EnableDLSSFrameGeneration>true</EnableDLSSFrameGeneration>'
          '    <DLSSSdkDir>@DLSSROOT@</DLSSSdkDir>'
          '    <NvapiSdkDir>@NVAPIROOT@</NvapiSdkDir>'
          '  </PropertyGroup>'
          '</Project>'
        )
        $content = ($lines -join [char]10).Replace('@DLSSROOT@', $env:DLSS_SDK_ROOT).Replace('@NVAPIROOT@', $env:NVAPI_SDK_ROOT)
        # Generate the gitignored local override file that turns on DLSS build switches
        Out-File -InputObject $content -Encoding utf8 "$env:GITHUB_WORKSPACE\src\BuildOptions.props.user"
        Get-Content "$env:GITHUB_WORKSPACE\src\BuildOptions.props.user"

    - name: Build
      run: python scripts/publish.py --compiler=MSVC --platform=x64

    - name: Store build
      uses: actions/upload-artifact@v7
      with:
        name: Magpie_CS-x64
        path: ./publish/x64
